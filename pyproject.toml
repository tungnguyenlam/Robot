[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egograph"
version = "0.1.0"
description = "Egocentric hand-object data pipeline for graph-guided dexterous manipulation learning"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6",
  "av>=12",            # PyAV: frame-accurate video decoding
  "pillow>=10",
  "scipy>=1.10",       # rotations
]

[project.optional-dependencies]
torch = ["torch>=2.1", "smplx>=0.1.28"]   # torch clip dataset + MANO forward kinematics
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
egograph = "egograph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
egograph = ["viewer/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
